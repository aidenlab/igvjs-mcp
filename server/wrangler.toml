# The top level is local development (`wrangler dev`) and the tests; it is never
# deployed. Deployments are the named environments at the bottom.
name = "igvjs-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# The Cloudflare account that owns the 3dg.io zone (Theaidenlab@gmail.com's
# Account). Named so that a login with access to several accounts does not have
# to choose; the deploy scripts read it from here for the Pages commands too.
account_id = "1eadb18bb8557fd1bd06b1d0310a902e"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# What this Worker runs, reported as the MCP serverInfo.version and as "worker" at
# GET /version: "<tag> (<short sha>)" or "<branch> (<short sha>)". A deploy stamps it from git with --var
# (scripts/deploy-dev.sh, scripts/version.mjs); this value is what anything else runs.
VERSION = "local"
# The Viewer's address: a Join link is this URL carrying ?room=. The Viewer is
# hosted on its own origin, not by this Worker (ADR 0001). GET /version reads the
# page's version.json at this URL's root.
VIEWER_URL = "http://localhost:5173/"
# Pages that may open /ws (exact Origin match). WebSockets are not covered by CORS.
# The last is the round trip's Viewer (roundtrip/addresses.ts).
VIEWER_ORIGINS = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:4173",
]

# Secrets (`wrangler secret put <NAME> --env <env>`, see scripts/deploy-wizard.sh;
# for `wrangler dev`, in .dev.vars, see .dev.vars.example):
# SESSION_HMAC_SECRET  - HMAC key deriving Room ids from x-openai-session (ChatGPT);
#                        unset → those requests fail. There is no fallback key.

# ── Development deployment: "igv dev" ────────────────────────────────────────
# Each deployment is named igv-mcp[-dev] for the Worker and igv-viewer[-dev]
# for the Viewer's Pages project. Worker igv-mcp-dev at https://igv-mcp-dev.3dg.io
# (Hosts use /mcp, Viewers /ws), paired with the Pages project igv-viewer-dev at
# https://igv-viewer-dev.pages.dev/ (scripts/deploy-dev.sh). A Viewer has no
# custom domain. Wrangler creates the DNS record for the Worker's custom domain;
# the zone is on the same account. No *.workers.dev hostname and no preview URLs,
# so the Worker has one public address. Named environments do not inherit `vars` or
# `durable_objects`, so those are repeated; migrations are top-level and apply to
# every environment.
[env.dev]
name = "igv-mcp-dev"
routes = [
  { pattern = "igv-mcp-dev.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[env.dev.observability.logs]
enabled = true

[[env.dev.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[env.dev.vars]
# Stamped by scripts/deploy-dev.sh; a bare `wrangler deploy --env dev` says so.
VERSION = "unstamped"
VIEWER_URL = "https://igv-viewer-dev.pages.dev/"
VIEWER_ORIGINS = [
  "https://igv-viewer-dev.pages.dev",
]

# ── Production deployment: "igv prod" ────────────────────────────────────────
# Released only from a pushed prod-YYYY-MM-DD[.N] tag by scripts/deploy-prod.sh:
# Worker igv-mcp at https://igv-mcp.3dg.io, paired with the Pages project
# igv-viewer at https://igv-viewer.pages.dev/. Otherwise as igv dev above.
[env.prod]
name = "igv-mcp"
routes = [
  { pattern = "igv-mcp.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[env.prod.observability.logs]
enabled = true

[[env.prod.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[env.prod.vars]
# Stamped with the release tag by scripts/deploy-prod.sh; a bare `wrangler deploy --env prod` says so.
VERSION = "unstamped"
VIEWER_URL = "https://igv-viewer.pages.dev/"
VIEWER_ORIGINS = [
  "https://igv-viewer.pages.dev",
]
